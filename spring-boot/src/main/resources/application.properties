spring.application.name=carddemo
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.h2.console.enabled=false
carddemo.batch.output-dir=target/carddemo-batch
carddemo.seed.enabled=true
carddemo.seed.data-dir=../app/data
carddemo.seed.force=false
carddemo.seed.usrsec-charset=IBM037
# The supplied ASCII acctdata generator writes ACCT-GROUP-ID into the ZIP slot.
# Set false to preserve strict copybook offsets.
carddemo.seed.acctdata-group-id-in-zip-slot=true
