<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('CardDemo', 'CTTU', 'COTRTUPC', ~{::content})}">
<head>
    <title>CardDemo</title>
</head>
<body>
<div th:fragment="content" class="card-list">
    <div class="list-title-row">
        <span class="list-title">Update Transaction Type</span>
    </div>
    <form id="tran-type-maint-form" method="post" th:action="@{/ui/tran-types/maint}">
        <!-- TTUP-UPDATE-SCREEN-DATA + CDEMO-FROM-PROGRAM (COTRTUPC.cbl:
             294-335) round-trip as hidden inputs. -->
        <input type="hidden" name="action" th:value="${state.action}">
        <input type="hidden" name="oldType" th:value="${state.oldType}">
        <input type="hidden" name="oldDesc" th:value="${state.oldDesc}">
        <input type="hidden" name="newType" th:value="${state.newType}">
        <input type="hidden" name="newDesc" th:value="${state.newDesc}">
        <input type="hidden" name="reenter" th:value="${state.reenter}">
        <input type="hidden" name="fromProgram" th:value="${state.fromProgram}">

        <div class="form-row">
            <label class="field-label" for="trtypcd">Transaction Type  :</label>
            <input id="trtypcd" name="trtypcd" type="text" maxlength="2" size="2"
                   autocomplete="off" inputmode="numeric" th:value="${screen.trtypcd}"
                   th:readonly="${!screen.codeEditable}"
                   th:attr="autofocus=${screen.cursorField == 'trtypcd' ? 'autofocus' : null}">
        </div>
        <div class="form-row">
            <label class="field-label" for="trtydsc">Description       :</label>
            <input id="trtydsc" name="trtydsc" type="text" maxlength="50" size="50"
                   autocomplete="off" th:value="${screen.trtydsc}"
                   th:readonly="${!screen.descEditable}"
                   th:attr="autofocus=${screen.cursorField == 'trtydsc' ? 'autofocus' : null}">
        </div>

        <p class="info-line" th:text="${screen.infoMessage}"></p>
        <p class="error-line" th:text="${screen.errorMessage}"></p>
        <p class="key-hints">ENTER=Process F3=Exit F4=Delete F5=Save F6=Add F12=Cancel</p>
        <div class="form-actions">
            <button type="submit" name="aid" value="ENTER">ENTER</button>
            <button type="submit" name="aid" value="PF3" formnovalidate>F3=Exit</button>
            <button type="submit" name="aid" value="PF4" formnovalidate>F4=Delete</button>
            <button type="submit" name="aid" value="PF5" formnovalidate>F5=Save</button>
            <button type="submit" name="aid" value="PF6" formnovalidate>F6=Add</button>
            <button type="submit" name="aid" value="PF12" formnovalidate>F12=Cancel</button>
        </div>
    </form>
    <script>
        // 3270 AID parity (COTRTUPC.cbl:577-623): validity is
        // state-dependent — an invalid press redisplays 'Invalid key
        // pressed' rather than acting.
        document.addEventListener('keydown', function (event) {
            if (/^F([1-9]|1[0-2])$/.test(event.key)) {
                event.preventDefault();
                var form = document.getElementById('tran-type-maint-form');
                var aid = document.createElement('input');
                aid.type = 'hidden';
                aid.name = 'aid';
                aid.value = 'PF' + event.key.substring(1);
                form.appendChild(aid);
                form.submit();
            }
        });
    </script>
</div>
</body>
</html>
