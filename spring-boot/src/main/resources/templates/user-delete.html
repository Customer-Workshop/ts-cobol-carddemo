<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('CardDemo', 'CU03', 'COUSR03C', ~{::content})}">
<head>
    <title>CardDemo</title>
</head>
<body>
<!-- COUSR3A (app/bms/COUSR03.bms): the USRIDIN fetch field, the asterisk
     separator, then the three display fields (no password on this map).
     'from' round-trips the caller token (S12-B4). -->
<div th:fragment="content" class="user-form">
    <p class="screen-title">Delete User</p>
    <form id="user-delete-form" method="post" th:action="@{/admin/users/delete}">
        <input type="hidden" name="from" th:value="${from}">
        <div class="form-row">
            <label class="field-label" for="usrIdIn">Enter User ID:</label>
            <input id="usrIdIn" name="usrIdIn" type="text" maxlength="8" size="8"
                   autocomplete="off" th:value="${screen.userId}"
                   th:attr="autofocus=${screen.cursorField == 'usridin' ? 'autofocus' : null}">
        </div>
        <p class="separator">***********************************************************************</p>
        <div class="form-row">
            <label class="field-label">First Name:</label>
            <span class="field-echo" th:text="${screen.firstName}">&nbsp;</span>
            <input type="hidden" name="fname" th:value="${screen.firstName}">
            <label class="field-label">Last Name:</label>
            <span class="field-echo" th:text="${screen.lastName}">&nbsp;</span>
            <input type="hidden" name="lname" th:value="${screen.lastName}">
        </div>
        <div class="form-row">
            <label class="field-label">User Type:</label>
            <span class="field-echo" th:text="${screen.userType}">&nbsp;</span>
            <input type="hidden" name="usrtype" th:value="${screen.userType}">
            <span class="field-hint">(A=Admin, U=User)</span>
        </div>
        <p class="key-hints">ENTER=Fetch  F3=Back  F4=Clear  F5=Delete</p>
        <div class="form-actions">
            <button type="submit" name="aid" value="ENTER">ENTER=Fetch</button>
            <button type="submit" name="aid" value="PF3" formnovalidate>F3=Back</button>
            <button type="submit" name="aid" value="PF4" formnovalidate>F4=Clear</button>
            <button type="submit" name="aid" value="PF5" formnovalidate>F5=Delete</button>
        </div>
    </form>
    <script>
        // 3270 AID parity: F3 backs out WITHOUT deleting, F4 clears, F5
        // deletes; PF12 exits to the admin menu (handled in the source even
        // though the footer omits it); other function keys are invalid.
        document.addEventListener('keydown', function (event) {
            if (/^F([1-9]|1[0-2])$/.test(event.key)) {
                event.preventDefault();
                var form = document.getElementById('user-delete-form');
                var aid = document.createElement('input');
                aid.type = 'hidden';
                aid.name = 'aid';
                aid.value = event.key === 'F3' ? 'PF3'
                        : event.key === 'F4' ? 'PF4'
                        : event.key === 'F5' ? 'PF5'
                        : event.key === 'F12' ? 'PF12'
                        : event.key;
                form.appendChild(aid);
                form.submit();
            }
        });
    </script>
</div>
</body>
</html>
