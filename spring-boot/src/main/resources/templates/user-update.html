<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('CardDemo', 'CU02', 'COUSR02C', ~{::content})}">
<head>
    <title>CardDemo</title>
</head>
<body>
<!-- COUSR2A (app/bms/COUSR02.bms): the USRIDIN fetch field, the asterisk
     separator, then the four editable fields. PASSWD is a dark field that
     echoes the stored password after a successful fetch (S12-B2 plaintext
     parity). 'from' round-trips the caller token (S12-B4). -->
<div th:fragment="content" class="user-form">
    <p class="screen-title">Update User</p>
    <form id="user-update-form" method="post" th:action="@{/admin/users/update}">
        <input type="hidden" name="from" th:value="${from}">
        <div class="form-row">
            <label class="field-label" for="usrIdIn">Enter User ID:</label>
            <input id="usrIdIn" name="usrIdIn" type="text" maxlength="8" size="8"
                   autocomplete="off" th:value="${screen.userId}"
                   th:attr="autofocus=${screen.cursorField == 'usridin' ? 'autofocus' : null}">
        </div>
        <p class="separator">***********************************************************************</p>
        <div class="form-row">
            <label class="field-label" for="fname">First Name:</label>
            <input id="fname" name="fname" type="text" maxlength="20" size="20"
                   autocomplete="off" th:value="${screen.firstName}"
                   th:attr="autofocus=${screen.cursorField == 'fname' ? 'autofocus' : null}">
            <label class="field-label" for="lname">Last Name:</label>
            <input id="lname" name="lname" type="text" maxlength="20" size="20"
                   autocomplete="off" th:value="${screen.lastName}"
                   th:attr="autofocus=${screen.cursorField == 'lname' ? 'autofocus' : null}">
        </div>
        <div class="form-row">
            <label class="field-label" for="passwd">Password:</label>
            <input id="passwd" name="passwd" type="password" maxlength="8" size="8"
                   autocomplete="off" th:value="${screen.password}"
                   th:attr="autofocus=${screen.cursorField == 'passwd' ? 'autofocus' : null}">
            <span class="field-hint">(8 Char)</span>
            <label class="field-label" for="usrtype">User Type:</label>
            <input id="usrtype" name="usrtype" type="text" maxlength="1" size="1"
                   autocomplete="off" th:value="${screen.userType}"
                   th:attr="autofocus=${screen.cursorField == 'usertype' ? 'autofocus' : null}">
            <span class="field-hint">(A=Admin, U=User)</span>
        </div>
        <p class="key-hints">ENTER=Fetch  F3=Save&amp;Exit  F4=Clear  F5=Save  F12=Cancel</p>
        <div class="form-actions">
            <button type="submit" name="aid" value="ENTER">ENTER=Fetch</button>
            <button type="submit" name="aid" value="PF3" formnovalidate>F3=Save&amp;Exit</button>
            <button type="submit" name="aid" value="PF4" formnovalidate>F4=Clear</button>
            <button type="submit" name="aid" value="PF5" formnovalidate>F5=Save</button>
            <button type="submit" name="aid" value="PF12" formnovalidate>F12=Cancel</button>
        </div>
    </form>
    <script>
        // 3270 AID parity: F3 saves and exits, F4 clears, F5 saves and
        // stays, F12 exits without saving; other function keys are invalid.
        document.addEventListener('keydown', function (event) {
            if (/^F([1-9]|1[0-2])$/.test(event.key)) {
                event.preventDefault();
                var form = document.getElementById('user-update-form');
                var aid = document.createElement('input');
                aid.type = 'hidden';
                aid.name = 'aid';
                aid.value = event.key === 'F3' ? 'PF3'
                        : event.key === 'F4' ? 'PF4'
                        : event.key === 'F5' ? 'PF5'
                        : event.key === 'F12' ? 'PF12'
                        : event.key;
                form.appendChild(aid);
                form.submit();
            }
        });
    </script>
</div>
</body>
</html>
