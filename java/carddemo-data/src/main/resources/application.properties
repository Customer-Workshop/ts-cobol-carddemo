spring.datasource.url=${CARDDEMO_DATASOURCE_URL:jdbc:h2:file:./data/carddemo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${CARDDEMO_DATASOURCE_USERNAME:sa}
spring.datasource.password=${CARDDEMO_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
carddemo.loader.enabled=${CARDDEMO_LOADER_ENABLED:false}
carddemo.loader.data-directory=${CARDDEMO_DATA_DIRECTORY:../../app/data/ASCII}
