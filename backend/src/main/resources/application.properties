spring.application.name=carddemo
spring.datasource.url=jdbc:postgresql://localhost:5433/carddemo
spring.datasource.username=${CARDDEMO_DB_USER:carddemo}
spring.datasource.password=${CARDDEMO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# import profile (--spring.profiles.active=import): one-shot load of the legacy extracts
carddemo.import.data-dir=../app/data
carddemo.import.usrsec-charset=IBM037
# The supplied ASCII acctdata extract writes ACCT-GROUP-ID into the ACCT-ADDR-ZIP slot (target state §5).
carddemo.import.acctdata-group-id-in-zip-slot=true
