# CardDemo — migrated from COBOL/CICS/VSAM
spring.application.name=carddemo

# H2 in-memory database (replaces VSAM KSDS files)
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Load schema.sql and data.sql on startup (after JPA/Batch metadata tables)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 Console (dev convenience)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Batch — use H2 for job repository, don't auto-run jobs on startup
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080
