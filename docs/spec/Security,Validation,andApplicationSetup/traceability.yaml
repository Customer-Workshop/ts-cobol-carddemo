  rule_name: Map validation feedback code to result message
  rule_text: 'WHEN the feedback code is returned from the validation service, THE
    Date Validation Handler SHALL map the feedback code to a corresponding result
    message: ''Date is valid'' for valid dates, ''Insufficient'' for insufficient
    data, ''Datevalue error'' for invalid date values, ''Invalid Era'' for invalid
    era, ''Unsupp. Range'' for unsupported ranges, ''Invalid month'' for invalid months,
    ''Bad Pic String'' for invalid format strings, ''Nonnumeric data'' for non-numeric
    input, ''YearInEra is 0'' for zero year in era, and ''Date is invalid'' for all
    other conditions.'
