fields:
  ACCTSIDA:
    description: "Account ID field attribute byte \u2014 controls BMS screen display\
      \ attributes (color, intensity, protection) for the account identifier input\
      \ field."
  ACCTSIDC:
    description: "Account ID field color attribute \u2014 specifies the foreground\
      \ color of the account identifier field on the BMS map."
  ACCTSIDF:
    description: "Account ID field flag/fset attribute \u2014 indicates whether the\
      \ account identifier field has been modified (MDT bit) on the BMS map."
  ACCTSIDH:
    description: "Account ID field highlight attribute \u2014 controls extended highlighting\
      \ (blink, reverse video, underline) for the account identifier field."
  ACCTSIDI:
    description: "Account identifier input value \u2014 the 11-character account ID\
      \ entered by the user or passed to the screen map."
  ACCTSIDL:
    description: "Account ID field length \u2014 binary length of the account identifier\
      \ field as returned by CICS BMS."
  ACCTSIDO:
    description: "Account identifier output value \u2014 the 11-character account\
      \ ID displayed to the user on the BMS screen map."
  ACCTSIDP:
    description: "Account ID field program-control attribute \u2014 used to programmatically\
      \ set BMS field attributes for the account identifier."
  ACCTSIDV:
    description: "Account ID field validation attribute \u2014 indicates input validation\
      \ status or cursor position for the account identifier field."
  CARDSIDA:
    description: "Card number field attribute byte \u2014 controls BMS screen display\
      \ attributes for the credit card number input field."
  CARDSIDC:
    description: "Card number field color attribute \u2014 specifies the foreground\
      \ color of the credit card number field on the BMS map."
  CARDSIDF:
    description: "Card number field flag/fset attribute \u2014 indicates whether the\
      \ credit card number field has been modified (MDT bit) on the BMS map."
  CARDSIDH:
    description: "Card number field highlight attribute \u2014 controls extended highlighting\
      \ for the credit card number field on the BMS map."
  CARDSIDI:
    description: "Card number input value \u2014 the 16-character credit card number\
      \ entered by the user or passed to the screen map."
  CARDSIDL:
    description: "Card number field length \u2014 binary length of the credit card\
      \ number field as returned by CICS BMS."
  CARDSIDO:
    description: "Card number output value \u2014 the 16-character credit card number\
      \ displayed to the user on the BMS screen map."
  CARDSIDP:
    description: "Card number field program-control attribute \u2014 used to programmatically\
      \ set BMS field attributes for the credit card number."
  CARDSIDV:
    description: "Card number field validation attribute \u2014 indicates input validation\
      \ status or cursor position for the credit card number field."
  CONFIRMA:
    description: "Confirmation field attribute byte \u2014 controls BMS screen display\
      \ attributes for the user confirmation input field."
  CONFIRMC:
    description: "Confirmation field color attribute \u2014 specifies the foreground\
      \ color of the confirmation field on the BMS map."
  CONFIRMF:
    description: "Confirmation field flag/fset attribute \u2014 indicates whether\
      \ the confirmation field has been modified (MDT bit) on the BMS map."
  CONFIRMH:
    description: "Confirmation field highlight attribute \u2014 controls extended\
      \ highlighting for the confirmation field on the BMS map."
  CONFIRMI:
    description: "Confirmation input value \u2014 single character entered by the\
      \ user to confirm an action (e.g., 'Y' = yes, 'N' = no)."
  CONFIRML:
    description: "Confirmation field length \u2014 binary length of the confirmation\
      \ field as returned by CICS BMS."
  CONFIRMO:
    description: "Confirmation output value \u2014 single character displayed to the\
      \ user in the confirmation field on the BMS screen map."
  CONFIRMP:
    description: "Confirmation field program-control attribute \u2014 used to programmatically\
      \ set BMS field attributes for the confirmation field."
  CONFIRMV:
    description: "Confirmation field validation attribute \u2014 indicates input validation\
      \ status or cursor position for the confirmation field."
  CURDATEA:
    description: "Current date field attribute byte \u2014 controls BMS screen display\
      \ attributes for the current date display field."
  CURDATEC:
    description: "Current date field color attribute \u2014 specifies the foreground\
