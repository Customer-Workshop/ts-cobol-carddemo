  rule_name: Write interest transaction record
  rule_text: WHEN monthly interest is computed for a transaction category, THE Interest
    Transaction Writer SHALL generate a unique transaction ID by concatenating the
    processing date with an incremented six-digit suffix; set the transaction type
    code to '01' (interest posting); set the category code to '05' (interest charges);
    set the source to 'System'; construct the description as 'Int. for a/c ' followed
    by the account ID; set the amount to the computed monthly interest; clear merchant
    fields; populate the card number from the cross-reference record; set the original
    and processed timestamps to the current date and time in DB2 format; write the
    completed transaction record to the transaction file
