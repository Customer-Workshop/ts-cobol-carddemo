  rule_name: Validate transaction against card and account rules
  rule_text: WHEN a daily transaction record is ready for validation, THE Transaction
    Validator SHALL look up the card number in the cross-reference file; if found,
    look up the associated account; if found, compute the projected balance and verify
    it does not exceed the credit limit and verify the account has not expired; set
    validation fail reason to 100 if card not found, 101 if account not found, 102
    if credit limit exceeded, 103 if account expired, or leave it at 0 if all validations
    pass.
