- rule_id: 1fc389b1_8769_4b60_90c3_182b1e73433b
  program: COTRN00C
  disposition: not_applicable
  reason: '[Pattern-classified] Screen rendering mechanics'
  program_path: cbl/COTRN00C.cbl
  rule_name: Retrieve and display forward page of transactions
  rule_text: WHILE forward pagination is requested, THE Forward Page Retrieval SHALL
    position the transaction file cursor at or after the specified transaction ID;
    if positioning fails, abort and redisplay with error message; if successful, read
    the next record to advance past the starting position if the current key is Enter,
    PF7, or PF3; initialize all 10 transaction row display fields to spaces; read
    up to 10 transaction records sequentially, populating each row with transaction
    ID, date, description, and amount; after reading, check if more records are available—if
    yes, increment the page number and read one more record to detect a next page;
    if no more records or error, increment the page number if at least one row was
    populated; display the current page number on the screen, clear the transaction
    ID search field, and send the populated screen.
