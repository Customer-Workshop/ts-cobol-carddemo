  rule_name: Process Enter key and dispatch report selection
  rule_text: WHEN the user presses the Enter key on the transaction report screen,
    THE Report Selection and Validation Handler SHALL evaluate the selected report
    type (monthly, yearly, or custom) and perform the appropriate date setup and validation;
    for monthly reports, set start date to the first day of the current month and
    end date to the last day of the current month; for yearly reports, set start date
