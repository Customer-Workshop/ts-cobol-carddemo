    row.
- rule_id: 3d6cfdd9_c028_4c4b_ad3f_8590bdb848fc
  program: COUSR00C
  disposition: not_applicable
  reason: '[Pattern-classified] Working storage initialization'
  program_path: cbl/COUSR00C.cbl
  rule_name: Retrieve and display forward page of users
  rule_text: WHILE the user security file contains records matching the search criteria,
    WHEN forward-page processing is invoked from Enter key, PF8 key, or initial entry,
    THE Forward Page Retrieval SHALL start a browse at the search key; if the key
    press is Enter, PF7, or PF3, read the next record to skip the current key; initialize
    all 10 user rows to spaces; loop up to 10 times reading and populating user data
    rows; if more records exist after the 10th row, increment the page number and
    read one more record to detect a next page; if no more records exist, increment
    the page number only if at least one row was populated; display the current page
    number and send the screen.
