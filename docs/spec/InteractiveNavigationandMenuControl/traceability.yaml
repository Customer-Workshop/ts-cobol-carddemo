  program: COTRN00C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMS platform mechanics'
  program_path: cbl/COTRN00C.cbl
  rule_name: Send transaction list screen to user
  rule_text: THE Transaction List Screen Sender SHALL populate the screen header with
    current date, time, and title information, move any pending error or informational
    message to the screen's error message field, then evaluate the screen-erase flag—if
    set to 'Y', send the screen map with the ERASE option to clear the terminal display;
    if set to 'N', send the screen map without the ERASE option to preserve the current
    display.
- rule_id: 9f5fde90_3123_437b_87ca_8ae5cff4310b
  program: COTRN00C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMS platform mechanics'
  program_path: cbl/COTRN00C.cbl
  rule_name: Process PF7 key for backward pagination
  rule_text: WHEN the user presses the PF7 function key, THE Backward Pagination Handler
    SHALL determine the starting transaction ID for backward search—if the first transaction
    ID from the current page is empty or low-values, set to low-values; otherwise
    use the first transaction ID. Set the next-page flag to 'Y'. If the current page
    number is greater than 1, initiate backward pagination to retrieve the previous
    page. If already at page 1, display the message 'You are already at the top of
    the page...', set the screen-erase flag to 'N', and redisplay the screen without
    clearing it.
- rule_id: a64c9ab5_cbd0_44b4_bec0_3865370d0418
  program: COTRN00C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMS platform mechanics'
  program_path: cbl/COTRN00C.cbl
  rule_name: Process PF8 key for forward pagination
  rule_text: WHEN the user presses the PF8 function key, THE Forward Pagination Handler
    SHALL determine the starting transaction ID for forward search—if the last transaction
    ID from the current page is empty or low-values, set to high-values; otherwise
    use the last transaction ID. If the next-page flag is set to 'Y', initiate forward
    pagination to retrieve the next page. If the next-page flag is not set, display
    the message 'You are already at the bottom of the page...', set the screen-erase
    flag to 'N', and redisplay the screen without clearing it.
- rule_id: da76b636_df89_4c63_b7c2_49c095098d2f
  program: COTRN00C
  disposition: not_applicable
