  rule_name: Position transaction file cursor for forward browse
  rule_text: WHEN forward pagination is initiated, THE Transaction File Browse Starter
    SHALL position the transaction file cursor at or after the specified transaction
    ID using a browse-start operation with greater-than-or-equal key matching; if
    successful (NORMAL response), the cursor is positioned for sequential reads; if
    NOT-FOUND response, set the end-of-file flag to 'Y', display the message 'You
    are at the top of the page...', set the transaction ID input field to error state,
    and redisplay the screen; if any other error response, set the error flag to 'Y',
    display the message 'Unable to lookup transaction...', set the transaction ID
    input field to error state, and redisplay the screen.
