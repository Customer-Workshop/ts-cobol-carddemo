  rule_text: WHEN the previous transaction record is requested, THE Transaction File
    Reverse Sequential Reader SHALL read the previous transaction record in reverse
    sequence from the file at the current cursor position and move the cursor backward;
    if successful (NORMAL response), the transaction record is retrieved; if END-FILE
    response, set the end-of-file flag to 'Y', display the message 'You have reached
    the top of the page...', set the transaction ID input field to error state, and
    redisplay the screen; if any other error response, set the error flag to 'Y',
    display the message 'Unable to lookup transaction...', set the transaction ID
    input field to error state, and redisplay the screen.
