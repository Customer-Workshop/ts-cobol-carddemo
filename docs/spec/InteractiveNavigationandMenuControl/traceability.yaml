- rule_id: 0dc08abb_13ab_493d_b81f_53a87c37e06d
  program: COUSR00C
  disposition: not_applicable
  reason: '[Pattern-classified] Working storage initialization'
  program_path: cbl/COUSR00C.cbl
  rule_name: Retrieve and display backward page of users
  rule_text: WHILE the user security file contains records matching the search criteria
    and the current page number is greater than 1, WHEN backward-page processing is
    invoked from the PF7 key, THE Backward Page Retrieval SHALL start a browse at
    the search key; if the key press is Enter or PF8, read the previous record to
    skip the current key; initialize all 10 user rows to spaces; loop up to 10 times
    reading previous records and populating user data rows in reverse order (row 10
    to row 1); if a prior page exists, decrement the page number if greater than 1,
    otherwise set page number to 1; display the current page number and send the screen.
