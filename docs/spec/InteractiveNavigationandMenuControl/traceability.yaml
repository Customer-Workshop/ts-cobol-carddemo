    erase, and keyboard unlock
- rule_id: bf7630d9_c01a_43a3_8c54_966e7f6838d1
  program: COACTUPC
  disposition: not_applicable
  reason: '[Pattern-classified] Working storage initialization'
  program_path: cbl/COACTUPC.cbl
  rule_name: Initialize program and prepare for transaction
  rule_text: THE Account Update Transaction Handler SHALL initialize the transaction
    environment, restore or reset the communication area based on entry context, remap
    function keys, and validate the pressed key against the current transaction state
- rule_id: 2c6975e8_5896_48ed_8d46_10d41523055a
  program: COACTUPC
  disposition: not_applicable
  reason: '[Pattern-classified] Working storage initialization'
  program_path: cbl/COACTUPC.cbl
  rule_name: Initialize program state and communication areas
  rule_text: THE Account Update Program SHALL initialize working storage, communication
    area, and account update screen data; when no caller data is present or the caller
    is the main menu on first entry, reset the account details status to not-fetched;
    otherwise restore the caller's data from the passed buffer.
- rule_id: 8dfa0ea0_ba04_43f5_bfa8_3a2e0e0f9b14
  program: COACTUPC
  disposition: captured
  rule_name: Validate function key for current program state
  rule_text: WHILE the program is processing a user input, WHEN a function key has
    been mapped, THE Function Key Validator SHALL mark the function key as invalid;
    set it to valid if the key is ENTER, PF3, PF5 (when changes are pending), or PF12
    (when account details are available); if the function key remains invalid, override
    it to ENTER.
  req_id: REQ-F-003
