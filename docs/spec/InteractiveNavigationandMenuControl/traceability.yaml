  program: COBIL00C
  disposition: captured
  program_path: cbl/COBIL00C.cbl
  rule_name: Process confirmed bill payment transaction
  rule_text: WHEN the user has confirmed the bill payment (confirmation flag is set
    to true), THE Bill Payment Transaction Processor SHALL retrieve the card number
    from the cross-reference file; find the highest existing transaction ID by browsing
    the transaction file in reverse order; generate a new transaction ID by incrementing
    the highest ID; construct a transaction record with the payment details (type
    code 02, category code 2, source POS TERM, description BILL PAYMENT - ONLINE,
    amount equal to the account balance, merchant ID 999999999, merchant name BILL
    PAYMENT, merchant city N/A, merchant ZIP N/A); capture the current system timestamp
    and store it in both original and processed timestamp fields; write the transaction
    record to the transaction file; compute the new account balance by subtracting
    the transaction amount from the current balance; update the account record in
    the account data file; display a success message with the transaction ID on the
    screen
