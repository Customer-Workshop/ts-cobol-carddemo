  disposition: not_applicable
  reason: '[Pattern-classified] Screen rendering mechanics'
  program_path: cbl/COACTUPC.cbl
  rule_name: Position cursor on first error field
  rule_text: WHEN validation errors have been detected, THE Account Update Program
    SHALL evaluate error flags in priority order and position cursor to the first
    field with an error; if no errors, position to account ID field
