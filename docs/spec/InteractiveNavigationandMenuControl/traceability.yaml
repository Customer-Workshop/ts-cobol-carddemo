  rule_name: Initialize program state and prepare for first screen display
  rule_text: THE Transaction List Handler SHALL initialize the screen-erase flag to
    'Y', clear the error message area, and when no prior session context exists, clear
    the output map buffer, process the Enter key to retrieve the initial transaction
    list, and display the screen.
- rule_id: 098ec15b_b498_40e6_9b4c_0d206ce7e58c
  program: COTRN00C
