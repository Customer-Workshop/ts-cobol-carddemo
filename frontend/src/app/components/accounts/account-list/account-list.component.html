<h2>Accounts</h2>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="accounts" matSort (matSortChange)="sortData($event)"
           class="full-width">
      <ng-container matColumnDef="accountId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Account ID</th>
        <td mat-cell *matCellDef="let acct">{{ acct.accountId }}</td>
      </ng-container>

      <ng-container matColumnDef="activeStatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let acct">
          <mat-chip [highlighted]="acct.activeStatus === 'Y'"
                    [class.active-chip]="acct.activeStatus === 'Y'"
                    [class.inactive-chip]="acct.activeStatus !== 'Y'">
            {{ acct.activeStatus === 'Y' ? 'Active' : 'Inactive' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="currentBalance">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Current Balance</th>
        <td mat-cell *matCellDef="let acct">{{ acct.currentBalance | currency }}</td>
      </ng-container>

      <ng-container matColumnDef="creditLimit">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Credit Limit</th>
        <td mat-cell *matCellDef="let acct">{{ acct.creditLimit | currency }}</td>
      </ng-container>

      <ng-container matColumnDef="openDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Open Date</th>
        <td mat-cell *matCellDef="let acct">{{ acct.openDate }}</td>
      </ng-container>

      <ng-container matColumnDef="expirationDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Expiry Date</th>
        <td mat-cell *matCellDef="let acct">{{ acct.expirationDate }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let acct">
          <a mat-icon-button [routerLink]="['/accounts', acct.accountId]"
             matTooltip="View Details">
            <mat-icon>visibility</mat-icon>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
