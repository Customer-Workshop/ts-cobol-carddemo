<h2>Credit Cards</h2>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="cards" matSort (matSortChange)="sortData($event)"
           class="full-width">
      <ng-container matColumnDef="cardNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Card Number</th>
        <td mat-cell *matCellDef="let card">{{ maskCardNumber(card.cardNumber) }}</td>
      </ng-container>

      <ng-container matColumnDef="embossedName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Embossed Name</th>
        <td mat-cell *matCellDef="let card">{{ card.embossedName }}</td>
      </ng-container>

      <ng-container matColumnDef="accountId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Account ID</th>
        <td mat-cell *matCellDef="let card">{{ card.accountId }}</td>
      </ng-container>

      <ng-container matColumnDef="expirationDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Expiration</th>
        <td mat-cell *matCellDef="let card">{{ card.expirationDate }}</td>
      </ng-container>

      <ng-container matColumnDef="activeStatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let card">
          <mat-chip [class.active-chip]="card.activeStatus === 'Y'"
                    [class.inactive-chip]="card.activeStatus !== 'Y'">
            {{ card.activeStatus === 'Y' ? 'Active' : 'Inactive' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let card">
          <a mat-icon-button [routerLink]="['/cards', card.cardNumber]"
             matTooltip="View Details">
            <mat-icon>visibility</mat-icon>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
