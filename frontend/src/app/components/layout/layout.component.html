<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'"
               [opened]="!isMobile" class="app-sidenav">
    <div class="sidenav-header">
      <mat-icon class="logo-icon">credit_card</mat-icon>
      <span class="logo-text">CardDemo</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link"
           (click)="onNavClick()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      @if (isMobile) {
        <button mat-icon-button (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-title">CardDemo — Credit Card Management</span>
      <span class="toolbar-spacer"></span>
      <span class="user-display">{{ authService.user()?.displayName }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="Sign Out">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
